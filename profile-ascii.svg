<svg xmlns="http://www.w3.org/2000/svg" width="370" height="320" viewBox="0 0 370 320">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      @keyframes rowFade {
        from { opacity:0; transform:translateY(4px); }
        to   { opacity:1; transform:translateY(0);   }
      }
      @keyframes blink {
        0%,100% { opacity:1; }
        50%      { opacity:0; }
      }
    </style>
    <clipPath id="ascii-clip"><rect width="370" height="320" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#ascii-clip)">
    <!-- Background -->
    <rect width="370" height="320" fill="#0d1117"/>

    <!-- Title bar -->
    <rect width="370" height="36" fill="#161b22"/>
    <line x1="0" y1="36" x2="370" y2="36" stroke="#30363d" stroke-width="1"/>

    <!-- Traffic lights -->
    <circle cx="18" cy="18" r="5" fill="#ff5f57"/>
    <circle cx="36" cy="18" r="5" fill="#febc2e"/>
    <circle cx="54" cy="18" r="5" fill="#28c840"/>

    <!-- Title -->
    <text x="185" y="22"
      font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="12" fill="#6e7681" text-anchor="middle">~ profile.ascii</text>

    <!-- ASCII content -->
    <text x="185" y="87" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="13" fill="#39d353" text-anchor="middle" opacity="0" style="animation:rowFade 0.3s ease forwards;animation-delay:0ms">  ╔══════════════════════════╗  </text>
    <text x="185" y="103" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="13" fill="#39d353" text-anchor="middle" opacity="0" style="animation:rowFade 0.3s ease forwards;animation-delay:60ms">  ║                          ║  </text>
    <text x="185" y="119" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="13" fill="#39d353" text-anchor="middle" opacity="0" style="animation:rowFade 0.3s ease forwards;animation-delay:120ms">  ║                          ║  </text>
    <text x="185" y="135" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="13" fill="#39d353" text-anchor="middle" opacity="0" style="animation:rowFade 0.3s ease forwards;animation-delay:180ms">  ║      [ photo goes here ] ║  </text>
    <text x="185" y="151" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="13" fill="#39d353" text-anchor="middle" opacity="0" style="animation:rowFade 0.3s ease forwards;animation-delay:240ms">  ║                          ║  </text>
    <text x="185" y="167" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="13" fill="#39d353" text-anchor="middle" opacity="0" style="animation:rowFade 0.3s ease forwards;animation-delay:300ms">  ║   Drop your photo into   ║  </text>
    <text x="185" y="183" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="13" fill="#39d353" text-anchor="middle" opacity="0" style="animation:rowFade 0.3s ease forwards;animation-delay:360ms">  ║   the workspace and run: ║  </text>
    <text x="185" y="199" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="13" fill="#39d353" text-anchor="middle" opacity="0" style="animation:rowFade 0.3s ease forwards;animation-delay:420ms">  ║                          ║  </text>
    <text x="185" y="215" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="13" fill="#39d353" text-anchor="middle" opacity="0" style="animation:rowFade 0.3s ease forwards;animation-delay:480ms">  ║  python3 scripts/        ║  </text>
    <text x="185" y="231" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="13" fill="#39d353" text-anchor="middle" opacity="0" style="animation:rowFade 0.3s ease forwards;animation-delay:540ms">  ║    make_ascii_svg.py     ║  </text>
    <text x="185" y="247" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="13" fill="#39d353" text-anchor="middle" opacity="0" style="animation:rowFade 0.3s ease forwards;animation-delay:600ms">  ║    path/to/photo.jpg     ║  </text>
    <text x="185" y="263" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="13" fill="#39d353" text-anchor="middle" opacity="0" style="animation:rowFade 0.3s ease forwards;animation-delay:660ms">  ║                          ║  </text>
    <text x="185" y="279" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="13" fill="#39d353" text-anchor="middle" opacity="0" style="animation:rowFade 0.3s ease forwards;animation-delay:720ms">  ╚══════════════════════════╝  </text>
    <rect x="181" y="286" width="8" height="14" fill="#39d353" style="animation:blink 1s step-end infinite"/>
  </g>
</svg>