    <text x="101" y="320" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="12" fill="#e6edf3" opacity="0" style="animation:fadeSlide 0.45s ease forwards;animation-delay:1.65s">linkedin.com/in/sushilthakare</text>
    <text x="22" y="350" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="12" fill="#56d364" opacity="0" style="animation:fadeSlide 0.45s ease forwards;animation-delay:1.80s">$ </text>
    <rect x="38" y="338" width="8" height="13" fill="#56d364" opacity="0" style="animation:blink 1s step-end infinite,fadeSlide 0.45s ease forwards;animation-delay:1.80s,0s"/>
  </g>
</svg>