    <text x="101" y="200" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="12" fill="#e6edf3" opacity="0" style="animation:fadeSlide 0.45s ease forwards;animation-delay:0.90s">MERN · TypeScript · Python</text>
    <text x="22" y="224" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="12" font-weight="700" fill="#79c0ff" opacity="0" style="animation:fadeSlide 0.45s ease forwards;animation-delay:1.05s">Cloud</text>
    <text x="87" y="224" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="12" fill="#bc8cff" opacity="0" style="animation:fadeSlide 0.45s ease forwards;animation-delay:1.05s">: </text>
    <text x="101" y="224" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="12" fill="#e6edf3" opacity="0" style="animation:fadeSlide 0.45s ease forwards;animation-delay:1.05s">GCP · Docker · Nginx</text>
    <text x="22" y="248" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="12" font-weight="700" fill="#79c0ff" opacity="0" style="animation:fadeSlide 0.45s ease forwards;animation-delay:1.20s">Learning</text>
    <text x="87" y="248" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="12" fill="#bc8cff" opacity="0" style="animation:fadeSlide 0.45s ease forwards;animation-delay:1.20s">: </text>
    <text x="101" y="248" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="12" fill="#e3b341" opacity="0" style="animation:fadeSlide 0.45s ease forwards;animation-delay:1.20s">ML Algorithms · LLM APIs</text>
    <text x="22" y="272" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="12" font-weight="700" fill="#79c0ff" opacity="0" style="animation:fadeSlide 0.45s ease forwards;animation-delay:1.35s">Open to</text>
