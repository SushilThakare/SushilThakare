    <text x="101" y="272" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="12" fill="#e3b341" opacity="0" style="animation:fadeSlide 0.45s ease forwards;animation-delay:1.35s">SWE Roles · AI/ML Integrations</text>
    <text x="22" y="296" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="12" font-weight="700" fill="#79c0ff" opacity="0" style="animation:fadeSlide 0.45s ease forwards;animation-delay:1.50s">Email</text>
    <text x="87" y="296" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="12" fill="#bc8cff" opacity="0" style="animation:fadeSlide 0.45s ease forwards;animation-delay:1.50s">: </text>
    <text x="101" y="296" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="12" fill="#e6edf3" opacity="0" style="animation:fadeSlide 0.45s ease forwards;animation-delay:1.50s">sushil.thakare.work@gmail.com</text>
    <text x="22" y="320" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="12" font-weight="700" fill="#79c0ff" opacity="0" style="animation:fadeSlide 0.45s ease forwards;animation-delay:1.65s">LinkedIn</text>
