<svg xmlns="http://www.w3.org/2000/svg" width="490" height="340" viewBox="0 0 490 340">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      @keyframes fadeSlide {
        from { opacity:0; transform:translateX(-6px); }
        to   { opacity:1; transform:translateX(0);   }
      }
      @keyframes blink {
        0%,100% { opacity:1; }
        50%      { opacity:0; }
      }
    </style>
    <!-- Rounded clip -->
    <clipPath id="card-clip">
      <rect width="490" height="340" rx="10" ry="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip)">
    <!-- Outer background -->
    <rect width="490" height="340" fill="#0d1117"/>

    <!-- Title bar -->
    <rect width="490" height="42" fill="#161b22"/>
    <line x1="0" y1="42" x2="490" y2="42" stroke="#30363d" stroke-width="1"/>

    <!-- Traffic-light dots -->
    <circle cx="18" cy="21" r="6" fill="#ff5f57"/>
    <circle cx="38" cy="21" r="6" fill="#febc2e"/>
    <circle cx="58" cy="21" r="6" fill="#28c840"/>

    <!-- Title text -->
    <text x="245" y="26"
      font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="13" fill="#6e7681"
      text-anchor="middle">~ neofetch</text>

    <!-- Card content -->
    <text x="22" y="70" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="13" font-weight="700" fill="#56d364" opacity="0" style="animation:fadeSlide 0.5s ease forwards;animation-delay:0.1s">sushil@github</text>
    <text x="140" y="70" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="13" fill="#e6edf3" opacity="0" style="animation:fadeSlide 0.5s ease forwards;animation-delay:0.1s">~</text>
    <line x1="22" y1="80" x2="468" y2="80" stroke="#30363d" stroke-width="1" opacity="0.6"/>
    <text x="22" y="104" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="12" font-weight="700" fill="#79c0ff" opacity="0" style="animation:fadeSlide 0.45s ease forwards;animation-delay:0.30s">OS</text>
    <text x="87" y="104" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="12" fill="#bc8cff" opacity="0" style="animation:fadeSlide 0.45s ease forwards;animation-delay:0.30s">: </text>
    <text x="101" y="104" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="12" fill="#e6edf3" opacity="0" style="animation:fadeSlide 0.45s ease forwards;animation-delay:0.30s">macOS Sequoia 15.3</text>
    <text x="22" y="128" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="12" font-weight="700" fill="#79c0ff" opacity="0" style="animation:fadeSlide 0.45s ease forwards;animation-delay:0.45s">Host</text>
    <text x="87" y="128" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="12" fill="#bc8cff" opacity="0" style="animation:fadeSlide 0.45s ease forwards;animation-delay:0.45s">: </text>
    <text x="101" y="128" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="12" fill="#e6edf3" opacity="0" style="animation:fadeSlide 0.45s ease forwards;animation-delay:0.45s">github.com/SushilThakare</text>
    <text x="22" y="152" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="12" font-weight="700" fill="#79c0ff" opacity="0" style="animation:fadeSlide 0.45s ease forwards;animation-delay:0.60s">Shell</text>
    <text x="87" y="152" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="12" fill="#bc8cff" opacity="0" style="animation:fadeSlide 0.45s ease forwards;animation-delay:0.60s">: </text>
